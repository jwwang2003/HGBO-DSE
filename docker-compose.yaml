services:
  mcp-inference:
    build: .
    working_dir: /app
    command: "uv run python -m backend.mcp_server"
    environment:
      - HGBO_MCP_SECRET_DIR=/var/lib/hgbo-mcp
      - HGBO_MCP_HOST=0.0.0.0
      - HGBO_MCP_PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - hgbo_mcp_data:/var/lib/hgbo-mcp

volumes:
  hgbo_mcp_data:
