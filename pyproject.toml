[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pyg-torch-260-cpu"
url = "https://data.pyg.org/whl/torch-2.6.0+cpu.html"
format = "flat"
explicit = true
